[project]
name = "web-iot"
version = "0.1.0"
description = "ESP32 soil moisture + MQ-135 air quality dashboard (FastAPI + Datastar + DuckDB)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "duckdb>=2.0.1",
    "datastar-py>=1.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
