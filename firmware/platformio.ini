; ESP32 soil moisture + MQ-135 + SSD1306 OLED node.
; Build/flash from the repo root:  mise run fw:build | fw:upload | fw:monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv  ; 1.9 MB app slots (default 1.25 MB was 89% full), keeps OTA
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.12.1
    bblanchon/ArduinoJson@^7.4.2
    tzapu/WiFiManager@^2.0.17
