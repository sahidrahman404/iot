[tools]
python = "3.13"
uv = "latest"
"pipx:platformio" = "latest"

[settings]
# mise activates (and creates) the uv-managed .venv once uv.lock exists
python.uv_venv_auto = "create|source"

[env]
# local secrets/overrides (copy .env.example -> .env)
_.file = { path = ".env", redact = false }

[tasks.dev]
description = "Run the server with auto-reload (reachable from the ESP32 on your LAN)"
run = "uv run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 1"

[tasks.serve]
description = "Run the server (single worker: DuckDB allows only one writer process)"
run = "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --timeout-graceful-shutdown 3"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest -q"

[tasks.fake-device]
description = "Send fake sensor readings to the local server (no hardware needed)"
run = "uv run python -m tools.fake_device"

[tasks."fw:build"]
description = "Compile the ESP32 firmware"
dir = "firmware"
run = "pio run"

[tasks."fw:upload"]
description = "Flash the ESP32 over USB"
dir = "firmware"
run = "pio run -t upload"

[tasks."fw:monitor"]
description = "Open the ESP32 serial monitor"
dir = "firmware"
run = "pio device monitor"
